[workspace]
members = [
    "programs/*"
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[package]
name = "nft-staking-builders-q2-litesvm"
version = "0.1.0"
edition = "2021"
publish = false

[features]
idl-build = ["anchor-lang/idl-build"]

[dev-dependencies]
five8_core = { version = "0.1.2", features = ["std"] }
litesvm = "0.11.0"
solana-sdk = "3.0.0"
solana-system-interface = "3.2.0"
litesvm-token = "0.11.0"
spl-token = "9.0.0"
spl-associated-token-account = "8.0.0"
anchor-litesvm = "0.4.0"
anchor-lang = { version = "1.0.2", features = ["idl-build"] }
litesvm-utils = "0.4.0"
mpl-core = {version = "0.11.0"}

[[test]]
name = "litesvm-tests"
path = "tests/nft-staking-builders-q2.rs"
required-features = ["idl-build"]